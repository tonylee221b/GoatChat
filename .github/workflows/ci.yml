name: Go CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ci:
    name: Build, Check, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Verify Go Formatting
        run: |
          cd server
          if [ -n "$(gofmt -l .)" ]; then
            echo "Error: The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Build Application
        run: |
          cd server
          make build

      - name: Run Go Tests
        run: |
          cd server
          make test

      # Docker layer caching setup and building
      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Only on merge to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          tags: goat-chat:latest
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
