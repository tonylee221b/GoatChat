services:
  postgres:
    image: postgres:16-alpine
    container_name: goatchat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goatchat}
      POSTGRES_USER: ${POSTGRES_USER:-goatchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goatchat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-goatchat} -d $${POSTGRES_DB:-goatchat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: goatchat-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
