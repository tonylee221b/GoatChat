version: "2"
sql:
  - name: "chat"
    engine: "postgresql"
    schema: "db/migration"
    queries: "db/query/chat"
    gen:
      go:
        package: "chatsqlc"
        out: "internal/chat/adapter/out/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        query_parameter_limit: 0
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

  - name: "identity"
    engine: "postgresql"
    schema: "db/migration"
    queries: "db/query/identity"
    gen:
      go:
        package: "identitysqlc"
        out: "internal/identity/adapter/out/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        query_parameter_limit: 0
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "timestamptz"
            nullable: false
            go_type:
              type: "time.Time"
              pointer: false
